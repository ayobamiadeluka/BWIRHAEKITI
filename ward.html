<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ward | BWI-RHA Ekiti State</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>


<nav class="navbar">

    <div class="container nav-inner">

        <a href="index.html" class="logo">
            BWI-RHA <span>EKITI</span>
        </a>

        <button
            class="menu-btn"
            onclick="toggleMenu()"
            type="button"
        >
            ☰
        </button>

        <div class="nav-links" id="navLinks">

            <a href="index.html">Home</a>

            <a href="lga.html">LGAs</a>

        </div>

    </div>

</nav>


<section class="page-header">

    <div class="container">

        <h1 id="wardName">
            Loading...
        </h1>

        <p id="lgaName">
            Loading Local Government...
        </p>

    </div>

</section>


<!-- ============================
     EXCO
============================= -->

<section class="section">

    <div class="container">

        <div class="section-title">

            <h2>
                Ward EXCO
            </h2>

            <p>
                Ward leadership
            </p>

        </div>


        <div id="excoList">

            <div class="loading">
                Loading EXCOs...
            </div>

        </div>

    </div>

</section>


<!-- ============================
     MEMBERS
============================= -->

<section class="section">

    <div class="container">

        <div class="section-title">

            <h2>
                Approved Members
            </h2>

            <p>
                Registered and approved members
                of this ward.
            </p>

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            Name
                        </th>

                        <th>
                            Phone
                        </th>

                    </tr>

                </thead>


                <tbody id="memberList">

                    <tr>

                        <td colspan="2">

                            Loading members...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</section>


<footer>

    <div class="container">

        © 2026 BWI-RHA Ekiti State Chapter

    </div>

</footer>


<script src="supabase.js"></script>


<script>

/* ============================
   MENU
============================ */

function toggleMenu() {

    document
        .getElementById("navLinks")
        .classList
        .toggle("open");

}


/* ============================
   GET WARD ID
============================ */

const params =
    new URLSearchParams(
        window.location.search
    );

const wardId =
    params.get("ward");


/* ============================
   LOAD WARD
============================ */

async function loadWard() {

    const wardTitle =
        document.getElementById(
            "wardName"
        );

    const lgaTitle =
        document.getElementById(
            "lgaName"
        );


    if (!wardId) {

        wardTitle.textContent =
            "Ward Not Found";

        lgaTitle.textContent = "";

        return;
    }


    const {
        data,
        error
    } = await db
        .from("wards")
        .select(`
            id,
            name,
            lgas (
                id,
                name
            )
        `)
        .eq("id", wardId)
        .maybeSingle();


    if (error) {

        console.error(
            "WARD ERROR:",
            error
        );

        wardTitle.textContent =
            "Unable to load ward";

        lgaTitle.textContent =
            error.message;

        return;
    }


    if (!data) {

        wardTitle.textContent =
            "Ward Not Found";

        lgaTitle.textContent = "";

        return;
    }


    wardTitle.textContent =
        data.name;


    if (data.lgas) {

        lgaTitle.textContent =
            data.lgas.name;

    }

}


/* ============================
   LOAD EXCOS
============================ */

async function loadExcos() {

    const container =
        document.getElementById(
            "excoList"
        );


    if (!wardId) {

        container.innerHTML = `
            <div class="alert alert-error">
                Ward not found.
            </div>
        `;

        return;
    }


    const {
        data,
        error
    } = await db
        .from("excos")
        .select(`
            id,
            position,
            full_name,
            phone_no,
            photo_url
        `)
        .eq("ward_id", wardId)
        .order("position");


    if (error) {

        console.error(
            "EXCO ERROR:",
            error
        );

        container.innerHTML = `
            <div class="alert alert-error">

                Unable to load EXCOs.

                <br>

                ${escapeHTML(
                    error.message
                )}

            </div>
        `;

        return;
    }


    if (!data || data.length === 0) {

        container.innerHTML = `
            <div class="card">

                <h3>
                    No EXCO Assigned
                </h3>

                <p>
                    No ward executive has
                    been assigned yet.
                </p>

            </div>
        `;

        return;
    }


    container.innerHTML = "";


    data.forEach(exco => {

        const card =
            document.createElement(
                "div"
            );


        card.className =
            "exco-card";


        let photo = "";


        if (exco.photo_url) {

            photo = `

                <img
                    src="${escapeHTML(
                        exco.photo_url
                    )}"
                    alt="${escapeHTML(
                        exco.full_name
                    )}"
                    style="
                        width:80px;
                        height:80px;
                        border-radius:50%;
                        object-fit:cover;
                        margin-bottom:10px;
                    "
                >

            `;

        }


        card.innerHTML = `

            ${photo}

            <div class="exco-office">

                ${escapeHTML(
                    exco.position
                )}

            </div>

            <div class="exco-person">

                ${escapeHTML(
                    exco.full_name ||
                    "Not assigned"
                )}

            </div>

            ${
                exco.phone_no
                ?
                `
                <div style="margin-top:5px;">

                    ${escapeHTML(
                        exco.phone_no
                    )}

                </div>
                `
                :
                ""
            }

        `;


        container.appendChild(card);

    });

}


/* ============================
   LOAD MEMBERS
============================ */

async function loadMembers() {

    const tbody =
        document.getElementById(
            "memberList"
        );


    if (!wardId) {

        tbody.innerHTML = `
            <tr>
                <td colspan="2">
                    Ward not found.
                </td>
            </tr>
        `;

        return;
    }


    const {
        data,
        error
    } = await db
        .from("members")
        .select(`
            id,
            name,
            phone_no
        `)
        .eq("ward_id", wardId)
        .eq("status", "approved")
        .order("name");


    if (error) {

        console.error(
            "MEMBER ERROR:",
            error
        );

        tbody.innerHTML = `
            <tr>

                <td colspan="2">

                    Unable to load members.

                    <br>

                    ${escapeHTML(
                        error.message
                    )}

                </td>

            </tr>
        `;

        return;
    }


    if (!data || data.length === 0) {

        tbody.innerHTML = `
            <tr>

                <td colspan="2">

                    No approved members yet.

                </td>

            </tr>
        `;

        return;
    }


    tbody.innerHTML = "";


    data.forEach(member => {

        const row =
            document.createElement(
                "tr"
            );


        row.innerHTML = `

            <td>

                ${escapeHTML(
                    member.name
                )}

            </td>

            <td>

                ${escapeHTML(
                    member.phone_no
                )}

            </td>

        `;


        tbody.appendChild(row);

    });

}


/* ============================
   START
============================ */

loadWard();

loadExcos();

loadMembers();

</script>

</body>

</html>
