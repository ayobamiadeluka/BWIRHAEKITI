<script src="supabase.js"></script>


<script>

/* =====================================================
   MOBILE MENU
===================================================== */

const menuBtn =
    document.getElementById("menuBtn");

const navLinks =
    document.getElementById("navLinks");


menuBtn.addEventListener(
    "click",
    function () {

        const isOpen =
            navLinks.classList.toggle("open");

        menuBtn.setAttribute(
            "aria-expanded",
            isOpen ? "true" : "false"
        );

    }
);


document
    .querySelectorAll("#navLinks a")
    .forEach(function (link) {

        link.addEventListener(
            "click",
            function () {

                navLinks.classList.remove("open");

                menuBtn.setAttribute(
                    "aria-expanded",
                    "false"
                );

            }
        );

    });



/* =====================================================
   URL
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const lgaId =
    params.get("lga");



/* =====================================================
   ELEMENTS
===================================================== */

const lgaName =
    document.getElementById("lgaName");

const loading =
    document.getElementById("loading");

const wardGrid =
    document.getElementById("wardGrid");

const message =
    document.getElementById("message");



/* =====================================================
   LOAD LGA
===================================================== */

async function loadLGA() {

    if (!lgaId) {

        lgaName.textContent =
            "LGA Not Found";

        loading.style.display =
            "none";

        message.innerHTML = `

            <div class="alert alert-error">

                No Local Government was selected.

                <br><br>

                <a
                    href="lga.html"
                    class="btn btn-primary"
                >
                    Back to LGAs
                </a>

            </div>

        `;

        return false;

    }


    const {
        data,
        error
    } = await db
        .from("lgas")
        .select("id, name")
        .eq("id", lgaId)
        .maybeSingle();


    if (error) {

        console.error(
            "LGA ERROR:",
            error
        );


        loading.style.display =
            "none";


        message.innerHTML = `

            <div class="alert alert-error">

                Unable to load Local Government.

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

        return false;

    }


    if (!data) {

        lgaName.textContent =
            "LGA Not Found";

        loading.style.display =
            "none";

        return false;

    }


    lgaName.textContent =
        data.name;


    return true;

}



/* =====================================================
   LOAD WARDS
===================================================== */

    if (!lgaId) {
        return;
    }


    const {
        data,
        error
    } = await db
        .from("wards")
        .select("id, name")
        .eq("lga_id", lgaId)
        .order("name", {
            ascending: true
        });


    loading.style.display =
        "none";

        console.error(
            "WARD ERROR:",
            error
        );

            <div class="alert alert-error">

                Unable to load wards.

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

        return;

    }

            </div>
