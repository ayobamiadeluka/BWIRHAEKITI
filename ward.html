<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Local Governments | BWI-RHA Ekiti State
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

</head>


<body>


<!-- =====================================================
     NAVIGATION
===================================================== -->

<nav class="navbar">

    <div class="container nav-inner">


        <a
            href="index.html"
            class="logo"
        >
            BWI-RHA <span>EKITI</span>
        </a>


        <button
            class="menu-btn"
            id="menuBtn"
            type="button"
            aria-label="Open menu"
            aria-expanded="false"
        >
            ☰
        </button>


        <div
            class="nav-links"
            id="navLinks"
        >

            <a href="index.html">
                Home
            </a>

            <a href="lga.html">
                LGAs
            </a>

            <a href="create-account.html">
                Create Account
            </a>

            <a href="login.html">
                Login
            </a>

        </div>

    </div>

</nav>



<!-- =====================================================
     PAGE HEADER
===================================================== -->

<section class="page-header">

    <div class="container">

        <h1>
            Local Government Areas
        </h1>

        <p>
            Explore the Local Government Areas
            of BWI-RHA Ekiti State Chapter.
        </p>

    </div>

</section>



<!-- =====================================================
     LGA SECTION
===================================================== -->

<section class="section">

    <div class="container">


        <div
            id="message"
            style="margin-bottom:20px;"
        ></div>


        <div
            id="loading"
            class="loading"
        >
            Loading Local Government Areas...
        </div>


        <div
            id="lgaGrid"
            class="cards-grid"
        ></div>


    </div>

</section>



<!-- =====================================================
     FOOTER
===================================================== -->

<footer>

    <div class="container">

        <p>
            © 2026 BWI-RHA Ekiti State Chapter
        </p>

        <p>
            Business Women of Influence -
            Renewed Hope Agenda
        </p>

    </div>

</footer>



<!-- =====================================================
     SUPABASE
===================================================== -->

<script src="supabase.js"></script>



<script>

/* =====================================================
   MOBILE MENU
===================================================== */

const menuBtn =
    document.getElementById("menuBtn");

const navLinks =
    document.getElementById("navLinks");


menuBtn.addEventListener(
    "click",
    function () {

        const isOpen =
            navLinks.classList.toggle("open");

        menuBtn.setAttribute(
            "aria-expanded",
            isOpen ? "true" : "false"
        );

    }
);


document
    .querySelectorAll("#navLinks a")
    .forEach(function (link) {

        link.addEventListener(
            "click",
            function () {

                navLinks.classList.remove("open");

                menuBtn.setAttribute(
                    "aria-expanded",
                    "false"
                );

            }
        );

    });



/* =====================================================
   ELEMENTS
===================================================== */

const loading =
    document.getElementById("loading");

const lgaGrid =
    document.getElementById("lgaGrid");

const message =
    document.getElementById("message");



/* =====================================================
   LOAD LGAs
===================================================== */

async function loadLGAs() {

    loading.style.display = "block";

    lgaGrid.innerHTML = "";

    message.innerHTML = "";


    const {
        data,
        error
    } = await db
        .from("lgas")
        .select("id, name")
        .order("name", {
            ascending: true
        });


    loading.style.display = "none";


    if (error) {

        console.error(
            "LGA ERROR:",
            error
        );


        message.innerHTML = `

            <div class="alert alert-error">

                Unable to load Local Government Areas.

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

        return;

    }


    if (!data || data.length === 0) {

        message.innerHTML = `

            <div class="alert alert-error">

                No Local Government Areas
                were found.

            </div>

        `;

        return;

    }


    data.forEach(function (lga) {

        const card =
            document.createElement("div");


        card.className =
            "card";


        card.innerHTML = `

            <h3>

                ${escapeHTML(
                    lga.name
                )}

            </h3>


            <p>

                Explore wards and members
                under this Local Government.

            </p>


            <br>


            <a
                href="wards.html?lga=${encodeURIComponent(
                    lga.id
                )}"
                class="btn btn-primary"
            >

                View Wards

            </a>

        `;


        lgaGrid.appendChild(card);

    });

}



/* =====================================================
   START
===================================================== */

loadLGAs();

</script>


</body>

</html>
