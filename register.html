<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registration | BWI-RHA Ekiti State</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<nav class="navbar">

<div class="container nav-inner">

<a href="index.html" class="logo">
BWI-RHA <span>EKITI</span>
</a>

<button class="menu-btn" onclick="toggleMenu()">☰</button>

<div class="nav-links" id="navLinks">

<a href="index.html">Home</a>
<a href="lga.html">LGAs</a>
<a href="dashboard.html">Dashboard</a>

</div>

</div>

</nav>

<div class="container">

<div class="form-wrapper">

<h2>Member Registration</h2>

<p>
Complete your registration below.
</p>

<br>

<div id="message"></div>

<form id="registrationForm">

<div class="form-group">

<label>Full Name</label>

<input
type="text"
id="full_name"
class="form-control"
required
>

</div>

<div class="form-group">

<label>Phone Number</label>

<input
type="tel"
id="phone"
class="form-control"
required
>

</div>

<div class="form-group">

<label>LGA</label>

<select
id="lga"
class="form-control"
required
>

<option value="">
Loading LGAs...
</option>

</select>

</div>

<div class="form-group">

<label>Ward</label>

<select
id="ward"
class="form-control"
required
disabled
>

<option value="">
Select LGA first
</option>

</select>

</div>

<div class="form-group">

<label>Address</label>

<textarea
id="address"
class="form-control"
required
></textarea>

</div>

<button
class="btn btn-primary"
type="submit"
>

Submit Registration

</button>

</form>

</div>

</div>

<footer>

<div class="container">

© 2026 BWI-RHA Ekiti State Chapter

</div>

</footer>

<script src="supabase.js"></script>

<script>

function toggleMenu() {

document
.getElementById("navLinks")
.classList.toggle("open");

}

let lgaData = [];

async function loadLGAs() {

const lgaSelect =
document.getElementById("lga");

const { data, error } =
await db
.from("lgas")
.select("*")
.order("name");

if (error) {

console.error(error);

lgaSelect.innerHTML =
`<option value="">
Unable to load LGAs
</option>`;

return;

}

lgaData = data || [];

lgaSelect.innerHTML =
`<option value="">
Select LGA
</option>`;

lgaData.forEach(lga => {

const option =
document.createElement("option");

option.value = lga.id;

option.textContent = lga.name;

lgaSelect.appendChild(option);

});

}

async function loadWards(lgaId) {

const wardSelect =
document.getElementById("ward");

wardSelect.disabled = true;

wardSelect.innerHTML =
`<option>
Loading wards...
</option>`;

if (!lgaId) {

wardSelect.innerHTML =
`<option>
Select LGA first
</option>`;

return;

}

const { data, error } =
await db
.from("wards")
.select("*")
.eq("lga_id", lgaId)
.order("name");

if (error) {

console.error(error);

wardSelect.innerHTML =
`<option>
Unable to load wards
</option>`;

return;

}

wardSelect.innerHTML =
`<option value="">
Select Ward
</option>`;

(data || []).forEach(ward => {

const option =
document.createElement("option");

option.value = ward.id;

option.textContent = ward.name;

wardSelect.appendChild(option);

});

wardSelect.disabled = false;

}

document
.getElementById("lga")
.addEventListener("change", function() {

loadWards(this.value);

});

document
.getElementById("registrationForm")
.addEventListener("submit", async function(e) {

e.preventDefault();

const message =
document.getElementById("message");

const user =
await requireLogin();

if (!user) return;

const payload = {

user_id: user.id,

full_name:
document.getElementById("full_name").value.trim(),

phone:
document.getElementById("phone").value.trim(),

lga_id:
document.getElementById("lga").value,

ward_id:
document.getElementById("ward").value,

address:
document.getElementById("address").value.trim(),

status: "pending"

};

const { error } =
await db
.from("members")
.insert(payload);

if (error) {

console.error(error);

message.innerHTML =
`<div class="alert alert-error">
${escapeHTML(error.message)}
</div>`;

return;

}

message.innerHTML =
`<div class="alert alert-success">
Registration submitted successfully.
Your registration is now pending approval.
</div>`;

this.reset();

document.getElementById("ward").disabled = true;

});

loadLGAs();

</script>

</body>
</html>
