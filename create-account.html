<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account | BWI-RHA Ekiti State</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<nav class="navbar">

    <div class="container nav-inner">

        <a href="index.html" class="logo">
            BWI-RHA <span>EKITI</span>
        </a>

        <button
            class="menu-btn"
            onclick="toggleMenu()"
            type="button"
        >
            ☰
        </button>

        <div class="nav-links" id="navLinks">
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </div>

    </div>

</nav>


<section class="page-header">

    <div class="container">

        <h1>Create Account</h1>

        <p>Create your BWI-RHA member account.</p>

    </div>

</section>


<div class="container">

    <div class="form-wrapper">

        <h2>Create Account</h2>

        <p>Your account is required before member registration.</p>

        <br>

        <div id="message"></div>

        <form id="accountForm">

            <div class="form-group">

                <label for="email">
                    Email Address *
                </label>

                <input
                    type="email"
                    id="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password *
                </label>

                <input
                    type="password"
                    id="password"
                    class="form-control"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password *
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    class="form-control"
                    placeholder="Confirm your password"
                    minlength="6"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary"
                id="createBtn"
            >
                Create Account
            </button>

        </form>


        <p style="margin-top:20px;">

            Already have an account?

            <a
                href="login.html"
                style="color:#087f3f;font-weight:bold;"
            >
                Login
            </a>

        </p>

    </div>

</div>


<footer>

    <div class="container">
        © 2026 BWI-RHA Ekiti State Chapter
    </div>

</footer>


<script src="supabase.js"></script>

<script>

function toggleMenu() {

    document
        .getElementById("navLinks")
        .classList
        .toggle("open");

}


const form =
    document.getElementById("accountForm");

const message =
    document.getElementById("message");

const createBtn =
    document.getElementById("createBtn");


form.addEventListener("submit", async function(e) {

    e.preventDefault();

    message.innerHTML = "";

    const email =
        document
            .getElementById("email")
            .value
            .trim();

    const password =
        document
            .getElementById("password")
            .value;

    const confirmPassword =
        document
            .getElementById("confirmPassword")
            .value;


    if (password !== confirmPassword) {

        message.innerHTML = `
            <div class="alert alert-error">
                Passwords do not match.
            </div>
        `;

        return;
    }


    if (password.length < 6) {

        message.innerHTML = `
            <div class="alert alert-error">
                Password must contain at least 6 characters.
            </div>
        `;

        return;
    }


    createBtn.disabled = true;

    createBtn.textContent =
        "Creating Account...";


    const {
        data,
        error
    } = await db.auth.signUp({

        email: email,

        password: password

    });


    if (error) {

        console.error(error);

        message.innerHTML = `
            <div class="alert alert-error">
                ${escapeHTML(error.message)}
            </div>
        `;

        createBtn.disabled = false;

        createBtn.textContent =
            "Create Account";

        return;
    }


    /*
       Depending on Supabase email-confirmation
       settings, a session may or may not exist.
    */

    if (data.session) {

        message.innerHTML = `
            <div class="alert alert-success">

                Account created successfully!

                <br><br>

                You can now continue to
                <a
                    href="register.html"
                    style="font-weight:bold;color:#087f3f;"
                >
                    member registration
                </a>.

            </div>
        `;

    } else {

        message.innerHTML = `
            <div class="alert alert-success">

                Account created successfully.

                <br><br>

                Please check your email if
                email confirmation is required,
                then log in.

                <br><br>

                <a
                    href="login.html"
                    style="font-weight:bold;color:#087f3f;"
                >
                    Go to Login
                </a>

            </div>
        `;

    }


    form.reset();


    createBtn.disabled = false;

    createBtn.textContent =
        "Create Account";

});

</script>

</body>

</html>
