/* =====================================================
   ADMIN LAYOUT
===================================================== */

.admin-wrapper {
    max-width: 1200px;
    margin: 40px auto;
    padding: 0 15px 60px;
}

.admin-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 30px;
}

.admin-header h2 {
    margin: 0;
}

.admin-grid {
    display: grid;
    grid-template-columns: repeat(
        auto-fit,
        minmax(220px, 1fr)
    );
    gap: 20px;
    margin-bottom: 35px;
}

.admin-stat {
    padding: 25px;
    border-radius: 12px;
    background: white;
    box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

.admin-stat h3 {
    margin: 0 0 10px;
}

.admin-stat-number {
    font-size: 32px;
    font-weight: 700;
}

.admin-section {
    background: white;
    border-radius: 12px;
    padding: 25px;
    margin-bottom: 30px;
    box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

.admin-section h2 {
    margin-top: 0;
}

.admin-table-wrapper {
    width: 100%;
    overflow-x: auto;
}

.admin-table {
    width: 100%;
    border-collapse: collapse;
    min-width: 700px;
}

.admin-table th,
.admin-table td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}

.admin-table th {
    font-weight: 700;
}

.status {
    display: inline-block;
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
}

.status-pending {
    background: #fff3cd;
    color: #856404;
}

.status-approved {
    background: #d4edda;
    color: #155724;
}

.status-rejected {
    background: #f8d7da;
    color: #721c24;
}

.action-buttons {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

.btn-small {
    padding: 7px 12px;
    border: 0;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
}

.btn-approve {
    background: #198754;
    color: white;
}

.btn-reject {
    background: #dc3545;
    color: white;
}

.btn-delete {
    background: #6c757d;
    color: white;
}

.exco-form {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
    align-items: end;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
}

.form-control {
    width: 100%;
    box-sizing: border-box;
    padding: 11px;
    border: 1px solid #ccc;
    border-radius: 6px;
}
